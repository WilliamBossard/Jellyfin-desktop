<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Jellyfin</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="overlay.css">
</head>
<body>
    <div id="container">
        <img class="logo" src="logo.png">
        <form id="connect-form">
            <h1 id="title"></h1>
            <div id="spinner"></div>
            <input type="text" id="address" autofocus spellcheck="false">
            <button id="connect-button" type="submit"></button>
            <div id="offline-link-container" style="margin-top: 18px; text-align: center;">
                <button id="offline-button" type="button" style="background: transparent; border: 1px solid rgba(255,255,255,0.22); color: rgba(255,255,255,0.85); font-size: 0.88em; padding: 8px 18px; border-radius: 4px; cursor: pointer; text-transform: none; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; width: auto; transition: background .15s ease, border-color .15s ease;">
                    <svg viewBox="0 0 24 24" style="width: 16px; height: 16px; fill: currentColor;"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
                    Voir les fichiers téléchargés (Mode hors-ligne)
                </button>
            </div>
        </form>
        <div id="discovered-servers">
            <h3 id="discovered-servers-title"></h3>
            <div id="discovered-servers-list"></div>
        </div>
    </div>
    <script src="overlay.lang.js"></script>
    <script src="connectivityHelper.js"></script>
    <script src="overlay.js"></script>
</body>
</html>
